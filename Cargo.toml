# SPDX-License-Identifier: Apache-2.0
[package]
name = "munarium-gate"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "Deterministic decisions, durable execution claims, and isolated connector dispatch."
repository = "https://github.com/iokaio/munarium-gate"
readme = "README.md"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "=2.2.0"
jsonschema = { version = "=0.26.2", default-features = false }
# Pin both driver internals exactly; the umbrella crate resolves an incompatible SQLite links dependency.
sqlx-core = { version = "=0.8.6", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki"] }
sqlx-postgres = { version = "=0.8.6", default-features = false }
rusqlite = { version = "=0.37.0", features = ["bundled"], optional = true }

[features]
default = ["service"]
service = ["dep:rusqlite"]

[[bin]]
name = "munarium-gate"
path = "src/main.rs"
required-features = ["service"]

[dev-dependencies]
tempfile = "=3.27.0"
